version: '3.8'

services:
  # 1. Фронтенд (Сайт)
  frontend:
    image: lari914/my-app:latest
    ports:
      - "8080:80"
    depends_on:
      - backend

  # 2. Бэкенд (Сервер приложений)
  backend:
    image: lari914/my-backend:latest
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=mydb
    depends_on:
      - database

  # 3. Официальная база данных
  database:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mydb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
